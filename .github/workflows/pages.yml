name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Sprawdź składnię JavaScript
        run: node --check app.js && node --check data.js && node --check sw.js && node --check internal/app.js
      - name: Uruchom testy integralności i DOM
        run: python3 tests/validate.py && node tests/smoke.mjs
      - name: Sprawdź tryb offline i układ mobilny
        run: node tests/offline.mjs && node tests/mobile-layout.mjs
      - name: Sprawdź bezpieczeństwo panelu wewnętrznego
        run: node tests/internal-platform.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Przygotuj artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
